training:
  run_class: formal
  recipe_id: nvidia-rta2024-materialx-formal-300k-stage100k@1
  phases:
  - name: bootstrap
    steps: 100000
    routes: &id001
    - name: evaluator
      kind: reference-evaluator
      batch_size: 65000
      direction_count: 1
      seed_offset: 0
      options:
        direction_proposal: uniform-half-difference@1
        mip_exponential_scale: 1.0
        spatial_samples_per_texel_area: 1.0
        maximum_spatial_samples: 64
    - name: sampler
      kind: method-sampler
      batch_size: 65000
      direction_count: 1
      seed_offset: 1
      options:
        direction_proposal: uniform-hemisphere-conditioning@1
        mip_exponential_scale: 1.0
        spatial_samples_per_texel_area: 1.0
        maximum_spatial_samples: 64
    parameter_groups:
    - encoder
    - evaluator
    - sampler
    loss_terms:
    - evaluator_log1p_l1
    - sampler_forward_kl
    recipes: &id002
      filtering:
        latent_fetch: discrete-mip-bilinear-wrap@1
        mip_distribution: truncated-exponential-scale-1@1
        spatial_filter: gaussian-area-proportional-cap-64@1
        normal_filter: lean-first-second-moments@1
      mollification:
        steps: 20000
        start_degrees: 10.0
        samples: 256
    optimizer: &id003
      kind: adam
      betas:
      - 0.9
      - 0.999
      epsilon: 1.0e-07
      weight_decay: 0.0
    optimizer_state_policy: reset
    schedule:
      kind: cosine
      start: 0.001
      end: 0.0001
      total_steps: 300000
      offset: 0
    precision: &id004
      autocast: fp32
      gradient_scaler: false
    checkpoint_boundary: true
    transition: materialize-assets
    log_interval: 100
    gradient_audit_interval: 1000
    prefetch_depth: 2
  - name: finetune
    steps: 200000
    routes: *id001
    parameter_groups:
    - asset
    - evaluator
    - sampler
    loss_terms:
    - evaluator_log1p_l1
    - sampler_forward_kl
    recipes: *id002
    optimizer: *id003
    optimizer_state_policy: carry-overlap
    schedule:
      kind: cosine
      start: 0.001
      end: 0.0001
      total_steps: 300000
      offset: 100000
    precision: *id004
    checkpoint_boundary: true
    transition: null
    log_interval: 100
    gradient_audit_interval: 1000
    prefetch_depth: 2
  validation:
    interval: 50000
    batches: 1
