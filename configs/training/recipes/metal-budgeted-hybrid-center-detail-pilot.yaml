          start: 0.0003
          end: 0.00005
          total_steps: 2048
          offset: 0
        precision:
          autocast: bfloat16
          gradient_scaler: false
        checkpoint_boundary: true
        transition: null
        log_interval: 16
        gradient_audit_interval: 128
        prefetch_depth: 2
      - name: deployment-qat-refine
