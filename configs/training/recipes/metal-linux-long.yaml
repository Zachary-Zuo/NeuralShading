format_name: ncls.training-fragment
format_version: 1
kind: recipe
key: metal-linux-long
extends: metal-linux-smoke
compatible_methods: [metal]
payload:
  training:
    run_class: formal
    recipe_id: metal-fused-full-cohort-linux-long-120k@1
    phase_graph:
      order: [joint-coarse-to-fine, qat-refine]
      definitions:
        joint-coarse-to-fine:
          steps: 105000
          schedule:
            kind: cosine
            start: 0.0003
            end: 0.00005
            total_steps: 120000
            offset: 0
          log_interval: 10
          gradient_audit_interval: 100
        qat-refine:
          steps: 15000
          schedule:
            kind: cosine
            start: 0.0001
            end: 0.00002
            total_steps: 120000
            offset: 105000
          log_interval: 10
          gradient_audit_interval: 100
    validation:
      interval: 5000
      batches: 4
