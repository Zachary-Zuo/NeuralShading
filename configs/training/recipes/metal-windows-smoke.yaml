format_name: ncls.training-fragment
format_version: 1
kind: recipe
key: metal-windows-smoke
extends: null
compatible_methods: [metal]
payload:
  training:
    run_class: smoke
    recipe_id: metal-fused-full-stratified-smoke-16step@1
    phases:
      - name: joint-coarse-to-fine
        steps: 8
        routes: &routes
          - name: asset
            kind: asset-tile
            batch_size: 6
            direction_count: 1
            seed_offset: 0
            options:
              asset_indices: [6, 50, 22]
              max_core_texels: 64
              halo: 8
          - name: evaluator
            kind: reference-evaluator
            batch_size: 1
            direction_count: 1
            seed_offset: 1
            options:
              direction_proposal: uniform-half-difference@1
              evaluation_samples: 1
              footprint_samples: 1
              source_execution_mode: authoritative@1
              asset_tile_coherent: true
              spatial_tile_extent: 0.015625
              source_patch_size: 8
              maximum_rejection_rounds: 64
          - name: sampler
            kind: method-sampler
            batch_size: 1
            direction_count: 1
            seed_offset: 3
            options:
              direction_proposal: uniform-hemisphere-conditioning@1
              asset_tile_coherent: true
              spatial_tile_extent: 0.015625
              source_patch_size: 8
        parameter_groups: &joint-groups
          - codec_role_stems
          - codec_encoder
          - codec_decoder
          - codec_semantic_heads
          - asset_adapter
          - quantization
          - typed_compiler
          - optimized_state_teacher
          - prepared_model
          - angular_bank
          - analytic_core
          - hybrid_evaluator
          - proposal_sampler
        loss_terms: &joint-losses
          - codec-full
          - response-robust
          - linear-energy
          - peak-support
          - reciprocity
          - analytic-core-preservation
          - teacher-response
          - compiler-functional-distillation
          - proposal-forward-kl
          - proposal-density-fit
          - proposal-mode-coverage
          - proposal-weight-tail
          - sample-pdf-identity
        recipes:
          profile_id: metal_fused_full_v1
          codec: role-shared-unet-dual-head@1
          mip: independent-adjacent-decoded-state@1
          quantization: int8-per-channel-ste@1
          appearance: analytic-positive-hybrid@1
          direction: raw-half-learned-angular@1
          compiler: pure-typed-set-attention@1
          filtering: adjacent-decoded-state@1
          proposal: eleven-component-folded-analytic-mixture@1
          target: evaluator-luminance-times-abs-cosine@1
          hemisphere: renderer-shading-z-positive-folded-preimage@1
          random_tuple: cdf-remapped-float2@1
          proposal_weight:
            schema: linear-nonzero-ramp@1
            start: 0.05
            end: 1.0
            ramp_steps: 5000
        optimizer: &optimizer
          kind: adam
          betas: [0.9, 0.99]
          epsilon: 1.0e-8
          weight_decay: 1.0e-6
        optimizer_state_policy: reset
        schedule:
          kind: cosine
          start: 0.0003
          end: 0.00005
          total_steps: 16
          offset: 0
        precision:
          autocast: bfloat16
          gradient_scaler: false
        checkpoint_boundary: true
        transition: null
        log_interval: 1
        gradient_audit_interval: 4
        prefetch_depth: 1
      - name: qat-refine
        steps: 8
        routes: *routes
        parameter_groups:
          - codec_role_stems
          - codec_encoder
          - codec_decoder
          - codec_semantic_heads
          - asset_adapter
          - quantization
          - typed_compiler
          - prepared_model
          - angular_bank
          - analytic_core
          - hybrid_evaluator
          - proposal_sampler
        loss_terms:
          - codec-full
          - response-robust
          - linear-energy
          - peak-support
          - reciprocity
          - analytic-core-preservation
          - teacher-response
          - compiler-functional-distillation
          - proposal-forward-kl
          - proposal-density-fit
          - proposal-mode-coverage
          - proposal-weight-tail
          - sample-pdf-identity
          - runtime-fp16-qat
        recipes:
          profile_id: metal_fused_full_v1
          codec: role-shared-unet-dual-head@1
          mip: independent-adjacent-decoded-state@1
          quantization: int8-per-channel-ste@1
          appearance: analytic-positive-hybrid@1
          direction: raw-half-learned-angular@1
          compiler: pure-typed-set-attention@1
          filtering: adjacent-decoded-state@1
          proposal: eleven-component-folded-analytic-mixture@1
          target: evaluator-luminance-times-abs-cosine@1
          hemisphere: renderer-shading-z-positive-folded-preimage@1
          random_tuple: cdf-remapped-float2@1
          proposal_weight:
            schema: linear-nonzero-ramp@1
            start: 1.0
            end: 1.0
            ramp_steps: 1
          runtime_quantization: fp16-runtime-ste-int8-grid-qat-sensitive-fp32@1
        optimizer: *optimizer
        optimizer_state_policy: carry-overlap
        schedule:
          kind: cosine
          start: 0.0001
          end: 0.00002
          total_steps: 16
          offset: 8
        precision:
          autocast: fp32
          gradient_scaler: false
        checkpoint_boundary: true
        transition: null
        log_interval: 1
        gradient_audit_interval: 4
        prefetch_depth: 1
    validation:
      interval: 16
      batches: 1
