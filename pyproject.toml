[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-shading"
version = "0.1.0"
description = "多源原生材质到统一固定成本散射实现的研究系统"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "materialx==1.39.4",
  "pillow",
  "pyexr==0.5.0",
  "PyYAML>=6.0,<7",
]

[project.scripts]
ncls = "ncls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ncls.core.material" = ["abi/*.json", "schemas/*.json"]
"ncls.core.scattering" = ["abi/*.json"]
"ncls.bundle" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
markers = [
  "falcor: requires the built Falcor Python module and a D3D12 GPU",
  "slangpy: requires SlangPy with CUDA interop and a supported GPU",
]
